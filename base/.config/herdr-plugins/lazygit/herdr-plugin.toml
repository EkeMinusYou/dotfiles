# keys.command の popup はタイトルが "popup" 固定のため、タイトルを指定できるプラグインペインで lazygit を開く
id = "lazygit"
name = "Lazygit"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Open lazygit in a titled popup."
platforms = ["macos", "linux"]

[[panes]]
id = "lazygit"
title = "lazygit"
placement = "popup"
width = "100%"
height = "100%"
command = ["lazygit"]
